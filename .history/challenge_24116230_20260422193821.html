<body>

    <table border="2" style="border-collapse: collapse;">
        <tr>
            <th colspan="4" bgcolor="orange">Daftar Buku</th>

        <tr>
            <td>Judul</td>

        <tr>

            <td>:</td>
            <td>John Dean</td>
        </tr>

    <h3>Isilah Formulir Dibawah Ini</h3>
    <form id="f1">
        <table>
        <tr>
            <td>Nama:</td>
            <td style="padding-left: 125px;"><input type="text" name="nama"></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td style="padding-left: 125px;"><input type="password" autocomplete="new-password" name="pwd"></td> </tr>
        <tr>
            <td>Jenis Kelamin:</td>
            <td style="padding-left: 125px;">
                <input type="radio" name="jk" value="laki"> Laki - Laki 
                <input type="radio" name="jk" value="perempuan"> Perempuan
            </td>
        </tr>
        <tr>
            <td>Hobi:</td>
            <td style="padding-left: 125px;">
                <input type="checkbox" value="membaca"> Membaca Buku 
                <input type="checkbox" value="nulis"> Menulis 
                <input type="checkbox" value="mancing"> Memancing
            </td>
        </tr>
        <tr>
            <td>Asal Kota:</td>
            <td style="padding-left: 125px;">
                <select name="kota">
                    <option value="semarang">Semarang</option>
                    <option value="diy">DI Yogyakarta</option>
                    <option value="depook">Depok</option>
                </select>
            </td>
        </tr>
        <tr>
            <td style="vertical-align: middle;">Komentar Anda:</td>
            <td style="padding-left: 125px;"><textarea name="komen" cols="22" rows="5" placeholder="Masukkan Pendapat Anda" style="text-align: center;"></textarea></td> </tr>
    </table>
    </form>
    <button type="submit" form="f1" name="mulai">Mulai Proses!</button>
